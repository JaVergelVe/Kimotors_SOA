<div class="contenedor-motos">
    @for (moto of motosAcumuladas; track moto.modelo) {
    <div class="moto-card">
        <img [src]="moto.imagenes[0]" [alt]="moto.modelo" class="moto-imagen">
        <h3>{{moto.modelo}}</h3>
        <p>{{moto.marca}}</p>
        <p class="precio">{{moto.precio_aprox}}</p>
        <a [routerLink]="['/moto', moto.marca, moto.modelo]">Ver más</a>
    </div>
    }
</div>
  
@if (motosAcumuladas.length > 0 && hayMasMotos) {
    <div class="paginacion">
        <button (click)="cargarMas()" class="boton-cargar">Cargar más motos</button>
    </div>
}
  
@if (motosAcumuladas.length > 0 && !hayMasMotos) {
    <div class="paginacion">
        <p class="mensaje-fin">Has llegado al final de la lista</p>
    </div>
}
