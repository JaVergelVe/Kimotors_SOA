<div class="forgot-password-container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="forgot-password-form">
    <h2>Restablecer Contraseña</h2>

    <div class="form-group">
      <input
        type="password"
        placeholder="Nueva contraseña"
        formControlName="password"
        [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
      />
      <div class="invalid-feedback" *ngIf="form.get('password')?.hasError('required')">
        La contraseña es obligatoria.
      </div>
    </div>

    <div class="form-group">
      <input
        type="password"
        placeholder="Confirmar contraseña"
        formControlName="confirmPassword"
        [class.is-invalid]="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched"
      />
      <div class="invalid-feedback" *ngIf="form.get('confirmPassword')?.hasError('required')">
        La confirmación es obligatoria.
      </div>
      <div class="invalid-feedback" *ngIf="form.get('confirmPassword')?.hasError('passwordMismatch')">
        Las contraseñas no coinciden.
      </div>
    </div>

    <button type="submit" [disabled]="form.invalid">Enviar</button>

    <p *ngIf="successMessage">{{ successMessage }}</p>
    <p *ngIf="errorMessage" class="invalid-feedback">{{ errorMessage }}</p>
  </form>
</div>
