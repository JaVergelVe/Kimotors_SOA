<div class="reset-password-manual-container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reset-password-manual-form">
    <h1>Restablecer Contraseña</h1>

    <div class="form-group">
      <input
        type="password"
        placeholder="Nueva contraseña"
        formControlName="password"
        [class.is-invalid]="form.get('password')?.invalid && (form.get('password')?.touched || form.touched)"
      />
      <div class="invalid-feedback" *ngIf="form.get('password')?.hasError('required') && (form.get('password')?.touched || form.touched)">
        La contraseña es obligatoria.
      </div>
    </div>

    <div class="form-group">
      <input
        type="password"
        placeholder="Confirmar contraseña"
        formControlName="confirmPassword"
        [class.is-invalid]="form.get('confirmPassword')?.invalid && (form.get('confirmPassword')?.touched || form.touched)"
      />
      <div class="invalid-feedback" *ngIf="form.get('confirmPassword')?.hasError('required') && (form.get('confirmPassword')?.touched || form.touched)">
        La confirmación es obligatoria.
      </div>
      <div class="invalid-feedback" *ngIf="form.get('confirmPassword')?.hasError('passwordMismatch') && (form.get('confirmPassword')?.touched || form.touched)">
        Las contraseñas no coinciden.
      </div>
    </div>

    <button type="submit" [disabled]="form.invalid">Enviar</button>

    <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>
    <p *ngIf="errorMessage" class="invalid-feedback">{{ errorMessage }}</p>
  </form>
</div>
